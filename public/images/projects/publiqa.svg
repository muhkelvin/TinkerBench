<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Subtle Grid lines -->
  <g stroke="#334155" stroke-opacity="0.3" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Glow Orb -->
  <circle cx="850" cy="220" r="180" fill="#38BDF8" opacity="0.08" filter="blur(60px)"/>

  <!-- Top bar / Brand -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#accent)"/>
    <text x="24" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">P</text>
    <text x="64" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">Publiqa.</text>
    <rect x="180" y="16" width="130" height="24" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="245" y="32" font-family="monospace" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">CONTENT PLATFORM</text>
  </g>

  <!-- Hero Content -->
  <g transform="translate(100, 210)">
    <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC" letter-spacing="-1">
      Modern Editorial CMS &amp;
    </text>
    <text x="0" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#accent)" letter-spacing="-1">
      Publishing Dashboard
    </text>
    <text x="0" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94A3B8" letter-spacing="0">
      Kelola artikel, kategorisasi taksonomi, dan metrik publikasi editorial dengan cepat.
    </text>
  </g>

  <!-- Metric Cards in Mockup -->
  <g transform="translate(100, 420)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="220" height="130" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="24" y="40" font-family="monospace" font-size="12" font-weight="500" fill="#94A3B8">TOTAL ARTICLES</text>
    <text x="24" y="90" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#F8FAFC">24</text>

    <!-- Card 2 -->
    <rect x="250" y="0" width="220" height="130" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="274" y="40" font-family="monospace" font-size="12" font-weight="500" fill="#94A3B8">CATEGORIES</text>
    <text x="274" y="90" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#F8FAFC">8</text>

    <!-- Card 3 -->
    <rect x="500" y="0" width="220" height="130" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="524" y="40" font-family="monospace" font-size="12" font-weight="500" fill="#94A3B8">PUBLISHED / MO</text>
    <text x="524" y="90" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#38BDF8">+12</text>

    <!-- Card 4 Preview -->
    <rect x="750" y="0" width="250" height="130" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="774" y="40" font-family="monospace" font-size="12" font-weight="500" fill="#94A3B8">RECENT STATUS</text>
    <circle cx="780" cy="78" r="6" fill="#10B981"/>
    <text x="796" y="83" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Next.js App Router</text>
    <text x="774" y="108" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Fast Markdown &amp; RSS Feeds</text>
  </g>
</svg>
